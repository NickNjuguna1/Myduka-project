{% extends "base.html" %}
{% block content %}
<br>
<div class="text-center w-50 auth login-float">
    <div class="left fs-4" style="background-color: crimson; color: whitesmoke;">
        <p> Please enter your details to create an
            account! </p>
    </div>
    <form action="/register" class="form-control col-md-3 col-lg-4 col-xl-3 right" method="POST">
        <input type="text" id="fullname" name="fullname" class="mt-3 form-control" placeholder="Enter your full name"> <br>
        <input type="email" id="email" name="email" placeholder="Enter email address" class="form-control"> <br>
        <input type="password" id="password" name="password" placeholder="Enter password" class="form-control"> <br>
        <button type="submit" class="btn btn-primary ">Click to Register</button>
    </form>
</div>
{% endblock %}
{% block script %}
let table = new DataTable('#myTable');
{% endblock %}
