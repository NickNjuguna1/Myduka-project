{% extends "base.html" %}
{% block content %}
<br>
<div class="auth w-50 login-float">
    <div class="left">
        <div style="color: whitesmoke;" class="text-center mt-5">
            <h2> Hello! Welcome </h2>
            <p> Don't have an account? </p>
            <a href="{{ url_for('register') }}"><button type="submit" class="btn btn-primary sign_up fs-5">Register > </button></a>
        </div>
    </div>
    <div class="right form-control col-md-3 col-lg-4 col-xl-3">
        <div>
            <form action="/login" method="POST"> <br>
                <input type="text" id="email" name="email" placeholder="Enter existing email" class="form-control"><i
                    class="fa-regular fa-user"></i><br>
                <input type="password" id="password" name="password" class="form-control"
                    placeholder="Enter existing password"><i class="fa-solid fa-lock"></i><br>
                <button type="submit" class="btn btn-outline-primary px-4 py-2 container">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
let table = new DataTable('#myTable');
{% endblock %}
